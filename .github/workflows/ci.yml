name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # reads "packageManager" from package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Core-purity boundary check (spec §2.2 / ADR-0001) — on from commit one.
      - run: pnpm depcruise

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm --filter @shrimpler/shell-web build
